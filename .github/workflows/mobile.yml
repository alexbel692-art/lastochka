name: Ласточка (Android, iPhone, Windows, macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например 0.4.0)'
        required: true
      publish:
        description: 'Опубликовать в релизах'
        type: boolean
        default: true
      beta:
        description: 'Тестовая версия (получат только те, у кого включены «Тестовые версии»)'
        type: boolean
        default: false
      deps:
        description: 'Библиотеки: locked — строго по pubspec.lock; add — добавить новые (остальные не трогать); upgrade — обновить все'
        type: choice
        options: [locked, add, upgrade]
        default: locked

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile
    shell: bash

env:
  V: ${{ inputs.version }}
  DEPS: ${{ inputs.deps }}
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # одна версия Flutter для всех сборок: иначе при её выходе «плывут» версии библиотек
          flutter-version: 3.47.7
          cache: ${{ inputs.deps == 'locked' }}
      - name: Версия Flutter
        run: echo "::notice title=Flutter::$(flutter --version | head -1)"
      - name: Платформенные папки
        run: |
          flutter --version
          tool/annotate.sh "create" flutter create --no-pub --platforms android,ios,macos,windows --org app.lastochka --project-name lastochka .
          rm -f test/widget_test.dart
      - name: Настройка проекта
        run: python3 tool/ci_prepare.py
      # библиотеки строго по зафиксированным версиям: подменённое обновление чужой библиотеки само не попадёт
      - name: Зависимости
        run: |
          if [ "$DEPS" = "upgrade" ]; then
            tool/annotate.sh "pub upgrade" flutter pub upgrade
          elif [ "$DEPS" = "add" ] || ! git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            tool/annotate.sh "pub get" flutter pub get
          else
            tool/annotate.sh "pub get" flutter pub get
            # версии должны совпасть с зафиксированными до байта
            if ! git diff --quiet -- pubspec.lock; then
              echo "::error::pubspec.lock изменился: $(git diff -- pubspec.lock | grep '^[-+] ' | head -20 | tr '\n' ' ')"
              exit 1
            fi
          fi
      # pubspec.lock сохраняет отдельное задание без чужого кода (у сборки нет прав на запись)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: pubspec-lock
          path: mobile/pubspec.lock
      # сканер скачивается, сверяется с официальной контрольной суммой и запускается одним шагом —
      # до того, как начнёт работать сторонний код из библиотек (генератор иконок и т. п.)
      - name: Проверка зависимостей на уязвимости
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          curl -sSL --retry 3 -o /tmp/osv https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64
          echo "d6af4b67fa5de658598bd2d445efb99e90d1734b3146962418719c4350ecb74b  /tmp/osv" | sha256sum -c - || { echo "::error::Сканер уязвимостей не совпал с официальным"; exit 1; }
          chmod +x /tmp/osv
          set +e; /tmp/osv --format json --lockfile=pubspec.lock > /tmp/osv.json 2>/tmp/osv.err; rc=$?; set -e
          if [ $rc -eq 0 ]; then echo "::notice title=Зависимости::Известных уязвимостей не найдено"; exit 0; fi
          if [ $rc -ne 1 ]; then
            # сканер не смог проверить зависимости: для выпуска это остановка (непроверенное не публикуем),
            # для пробной сборки — предупреждение
            msg="не отработал (код $rc): $(tail -3 /tmp/osv.err | tr '\n' ' ')"
            if [ "$PUBLISH" = "true" ]; then echo "::error title=Сканер уязвимостей::$msg — выпуск остановлен"; exit 1; fi
            echo "::warning title=Сканер::$msg"; exit 0
          fi
          # найдены уязвимости. Политика: высокие и критические (CVSS 7+) останавливают выпуск, если не внесены
          # в .github/osv-allow.txt с обоснованием; средние, низкие и без оценки — предупреждением (разбираются вручную)
          python3 - <<'PY'
          import json, os, re
          d = json.load(open('/tmp/osv.json'))
          allow = {}
          try:
              for line in open('../.github/osv-allow.txt', encoding='utf-8'):
                  line = line.split('#', 1)[0].strip()
                  if line:
                      vid, _, why = line.partition(' ')
                      allow[vid] = why.strip()
          except FileNotFoundError:
              pass
          rows, block, unknown = [], [], []
          for r in d.get('results', []):
              for p in r.get('packages', []):
                  name = p.get('package', {}).get('name', '?')
                  for g in p.get('groups', []):
                      ids = g.get('ids', [])
                      sev = g.get('max_severity') or '?'
                      row = f"{name} {','.join(ids)} ({sev})"
                      rows.append(row)
                      if any(i in allow for i in ids):
                          continue
                      try:
                          if float(sev) >= 7.0: block.append(row)
                      except ValueError:
                          unknown.append(row)
          print('::warning title=Уязвимости в зависимостях::' + '; '.join(rows)[:3000])
          if unknown:
              print('::warning title=Уязвимости без оценки — разобрать вручную::' + '; '.join(unknown)[:3000])
          if block:
              print('::error title=Высокие/критические уязвимости::' + '; '.join(block)[:3000])
              if os.environ.get('PUBLISH') == 'true':
                  raise SystemExit(1)
          PY
      - name: Иконки
        run: tool/annotate.sh "icons" dart run flutter_launcher_icons
      - name: Проверка кода
        run: tool/annotate.sh "analyze" flutter analyze --no-fatal-infos --no-fatal-warnings
      # библиотека шифрования для сквозного теста (собирается из того же пакета, что и в приложении)
      - name: Библиотека шифрования для тестов
        run: tool/build_vodozemac_test_lib.sh >> "$GITHUB_ENV"
      - name: Тесты
        env:
          REQUIRE_E2EE_TEST: '1'
        run: tool/annotate.sh "tests" flutter test
      # APK собирается БЕЗ ключа подписи (временной подписью сборки) — настоящую подпись ставит отдельный
      # этап android-sign на чистой машине, где не работает ни код сборки, ни сторонние библиотеки
      - name: Сборка APK
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
        id: apk
        run: |
          mkdir -p ../dist
          B="--release --dart-define=APP_VERSION=$V --dart-define=GIPHY_KEY=$GIPHY_KEY --build-name=$V --build-number=${{ github.run_number }}"
          # отдельные APK под тип процессора (в 3 раза меньше) — их и ставит автообновление;
          # общий APK — для ручной установки и для обновления с версий до 4.5
          grep -q LASTOCHKA_ABI android/app/build.gradle.kts || { echo "::error::нет фильтра ABI в build.gradle.kts"; exit 1; }
          LASTOCHKA_ABI=arm64-v8a tool/annotate.sh "build apk arm64" flutter build apk $B --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/Lastochka-$V-Android-arm64.apk"
          LASTOCHKA_ABI=armeabi-v7a tool/annotate.sh "build apk arm" flutter build apk $B --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/Lastochka-$V-Android-arm.apk"
          tool/annotate.sh "build apk" flutter build apk $B
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/Lastochka-$V-Android.apk"
          for f in ../dist/*.apk; do echo "::notice::$(basename $f) — $(( $(stat -c%s $f) / 1048576 )) МБ, $(unzip -l $f | grep -oE 'lib/[^/]+/' | sort -u | tr '\n' ' ')"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: android
          path: dist/*

  # подпись APK настоящим ключом: только apksigner из Android SDK, без кода проекта и библиотек
  android-sign:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: in
      - name: Подпись APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out
          if [ -z "$KS" ]; then
            [ "$PUBLISH" = "true" ] && { echo "::error::Секрет ANDROID_KEYSTORE не задан — выпуск невозможен"; exit 1; }
            echo "::warning::Ключ не задан — APK остаются с временной подписью (только для проверки)"
            cp in/*.apk out/; exit 0
          fi
          AS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/k.jks"
          for f in in/*.apk; do
            "$AS" sign --ks "$RUNNER_TEMP/k.jks" --ks-pass env:KP --ks-key-alias lastochka --key-pass env:KP --out "out/$(basename "$f")" "$f"
          done
          rm -f "$RUNNER_TEMP/k.jks"
          # подпись — именно нашим ключом: полный отпечаток сертификата и ровно одна подпись
          FP=7994c098efa34a2dc89d31cfcbaf72e2b8585d4f0abc53668d5871784a057647
          for f in out/*.apk; do
            info="$("$AS" verify --verbose --print-certs "$f" 2>&1)" || { echo "::error::$(basename "$f") — подпись не прошла проверку: $(tr '\n' ' ' <<<"$info" | cut -c1-600)"; exit 1; }
            # «|| true»: строки может не быть — тогда проверка ниже скажет об этом понятно, а не молча упадёт
            signers="$( (grep -iE '^Number of signers:' <<<"$info" || true) | awk '{print $NF}' | tr -d '\r')"
            # отпечатки всех сертификатов подписи (у apksigner строки «Signer #1 …» и «Signer (minSdkVersion=…) …»)
            fps="$( (grep -ioE 'certificate SHA-256 digest: *[0-9a-f]{64}' <<<"$info" || true) | awk '{print tolower($NF)}' | sort -u)"
            [ -n "$fps" ] || echo "::notice title=apksigner::$(head -25 <<<"$info" | tr '\n' '|' | cut -c1-1500)"
            v2="$( (grep -iE '^Verified using v2 scheme' <<<"$info" || true) | awk '{print $NF}' | tr -d '\r')"
            echo "$(basename "$f"): подписей=$signers v2=$v2 отпечатки=$(tr '\n' ' ' <<<"$fps")"
            [ "$signers" = "1" ] || { echo "::error::$(basename "$f") — подписей: '$signers' (нужна одна)"; exit 1; }
            [ "$fps" = "$FP" ] || { echo "::error::$(basename "$f") подписан не тем ключом ('$(tr '\n' ' ' <<<"$fps")')"; exit 1; }
            [ "$v2" = "true" ] || { echo "::error::$(basename "$f") — нет подписи v2 ('$v2')"; exit 1; }
          done
          rm -f out/*.idsig
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: android-signed
          path: out/*

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # одна версия Flutter для всех сборок: иначе при её выходе «плывут» версии библиотек
          flutter-version: 3.47.7
          cache: ${{ inputs.deps == 'locked' }}
      - name: Платформенные папки
        run: |
          tool/annotate.sh "create" flutter create --no-pub --platforms android,ios,macos,windows --org app.lastochka --project-name lastochka .
          rm -f test/widget_test.dart
          python3 tool/ci_prepare.py
      - name: Зависимости
        run: |
          if [ "$DEPS" = "upgrade" ]; then tool/annotate.sh "ios pub upgrade" flutter pub upgrade
          elif [ "$DEPS" = "add" ]; then tool/annotate.sh "ios pub get" flutter pub get
          elif git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then tool/annotate.sh "ios pub get" flutter pub get; git diff --quiet -- pubspec.lock || { echo "::error::pubspec.lock изменился: $(git diff -- pubspec.lock | grep '^[-+] ' | head -20 | tr '\n' ' ')"; exit 1; }
          else tool/annotate.sh "ios pub get" flutter pub get; fi
          dart run flutter_launcher_icons
      # Без платной подписи Apple: собираем приложение без подписи и упаковываем в .ipa.
      # Поставить на iPhone можно через Sideloadly/AltStore со своим Apple ID.
      - name: Сборка iOS
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
        run: |
          tool/annotate.sh "ios config" flutter build ios --release --no-codesign --config-only --dart-define=APP_VERSION="$V" --dart-define=GIPHY_KEY="$GIPHY_KEY" --build-name="$V" --build-number="${{ github.run_number }}"
          cd ios
          ../tool/annotate.sh "build ios" xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination generic/platform=iOS -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build -quiet
          mkdir -p Payload ../../dist
          cp -R build/dd/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qry "../../dist/Lastochka-$V-iPhone-unsigned.ipa" Payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: ios
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # одна версия Flutter для всех сборок: иначе при её выходе «плывут» версии библиотек
          flutter-version: 3.47.7
          cache: ${{ inputs.deps == 'locked' }}
      - name: Платформенные папки
        run: |
          tool/annotate.sh "create" flutter create --no-pub --platforms android,ios,macos,windows --org app.lastochka --project-name lastochka .
          rm -f test/widget_test.dart
          python3 tool/ci_prepare.py
      - name: Зависимости
        run: |
          if [ "$DEPS" = "upgrade" ]; then tool/annotate.sh "macos pub upgrade" flutter pub upgrade
          elif [ "$DEPS" = "add" ]; then tool/annotate.sh "macos pub get" flutter pub get
          elif git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then tool/annotate.sh "macos pub get" flutter pub get; git diff --quiet -- pubspec.lock || { echo "::error::pubspec.lock изменился: $(git diff -- pubspec.lock | grep '^[-+] ' | head -20 | tr '\n' ' ')"; exit 1; }
          else tool/annotate.sh "macos pub get" flutter pub get; fi
          dart run flutter_launcher_icons
      - name: Сборка macOS
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
        run: tool/annotate.sh "build macos" flutter build macos --release --dart-define=APP_VERSION="$V" --dart-define=GIPHY_KEY="$GIPHY_KEY" --build-name="$V" --build-number="${{ github.run_number }}"
      - name: Образ диска
        run: |
          APP=build/macos/Build/Products/Release/Lastochka.app
          lipo -info "$APP/Contents/MacOS/Lastochka" || true
          mkdir -p dmg ../dist && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Ласточка" -srcfolder dmg -ov -format UDZO "../dist/Lastochka-$V-arm64.dmg"
          # одна универсальная сборка; второе имя — чтобы прежняя версия на Intel-Mac нашла обновление
          cp "../dist/Lastochka-$V-arm64.dmg" "../dist/Lastochka-$V-x64.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: macos
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # одна версия Flutter для всех сборок: иначе при её выходе «плывут» версии библиотек
          flutter-version: 3.47.7
          cache: ${{ inputs.deps == 'locked' }}
      - name: Платформенные папки
        run: |
          tool/annotate.sh "create" flutter create --no-pub --platforms android,ios,macos,windows --org app.lastochka --project-name lastochka .
          rm -f test/widget_test.dart
          python tool/ci_prepare.py
      - name: Зависимости
        run: |
          if [ "$DEPS" = "upgrade" ]; then tool/annotate.sh "windows pub upgrade" flutter pub upgrade
          elif [ "$DEPS" = "add" ]; then tool/annotate.sh "windows pub get" flutter pub get
          elif git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then tool/annotate.sh "windows pub get" flutter pub get; git diff --quiet -- pubspec.lock || { echo "::error::pubspec.lock изменился: $(git diff -- pubspec.lock | grep '^[-+] ' | head -20 | tr '\n' ' ')"; exit 1; }
          else tool/annotate.sh "windows pub get" flutter pub get; fi
          dart run flutter_launcher_icons
      - name: Сборка Windows
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
        run: tool/annotate.sh "build windows" flutter build windows --release --dart-define=APP_VERSION="$V" --dart-define=GIPHY_KEY="$GIPHY_KEY" --build-name="$V" --build-number="${{ github.run_number }}"
      # Проигрыватель видео (mpv + FFmpeg): сборка из media_kit — 2023 года, без исправлений безопасности FFmpeg
      # с тех пор. Подменяем libmpv-2.dll свежей сборкой mpv (shinchiro/mpv-winbuild-cmake, обычная x86_64 —
      # без требования AVX2). Версия закреплена тегом и отпечатком SHA-256; не сошлось — сборка останавливается.
      - name: Свежий libmpv (FFmpeg)
        env:
          GH_TOKEN: ${{ github.token }}
          MPV_TAG: '20261021'
          MPV_SHA256: 'efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633' # mpv-dev-x86_64-20261021-git-e471496c56.7z, mpv v0.41.0
        run: |
          R=build/windows/x64/runner/Release
          J=$(gh api "repos/shinchiro/mpv-winbuild-cmake/releases/tags/$MPV_TAG")
          N=$(echo "$J" | jq -r '.assets[].name' | grep -E '^mpv-dev-x86_64-[0-9]{8}-git-[0-9a-f]+\.7z$' | head -1)
          [ -n "$N" ] || { echo "::error::в выпуске $MPV_TAG нет mpv-dev-x86_64"; exit 1; }
          D=$(echo "$J" | jq -r --arg n "$N" '.assets[] | select(.name == $n) | .digest // ""')
          mkdir -p ../mpv && gh release download "$MPV_TAG" -R shinchiro/mpv-winbuild-cmake -p "$N" -D ../mpv
          H="sha256:$(sha256sum "../mpv/$N" | cut -d' ' -f1)"
          [ -z "$D" ] || [ "$H" = "$D" ] || { echo "::error::$N: $H, а GitHub указывает $D"; exit 1; }
          [ -z "$MPV_SHA256" ] || [ "$H" = "sha256:$MPV_SHA256" ] || { echo "::error::$N: $H вместо закреплённого $MPV_SHA256"; exit 1; }
          7z e -y "../mpv/$N" -o../mpv/x libmpv-2.dll -r > /dev/null
          [ -s ../mpv/x/libmpv-2.dll ] || { echo "::error::в $N нет libmpv-2.dll"; exit 1; }
          OLD=$(grep -a -o -m1 'mpv v0\.[0-9][0-9.]*[-0-9a-z]*' "$R/libmpv-2.dll" | head -1 || true)
          cp -f ../mpv/x/libmpv-2.dll "$R/libmpv-2.dll"
          NEW=$(grep -a -o -m1 'mpv v0\.[0-9][0-9.]*[-0-9a-z]*' "$R/libmpv-2.dll" | head -1 || true)
          echo "::notice::libmpv: $OLD -> $NEW ($N, $H)"
      # Проверка запуска на Windows: Ласточка стартует, не падает 40 секунд, окно не пустое (снимок — в артефакте).
      - name: Запуск на Windows
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/windows/x64/runner/Release/Lastochka.exe"
          $crash = Join-Path $env:TEMP "lastochka_native_crash.txt"
          Remove-Item $crash -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path ../smoke-win | Out-Null
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 40
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path (Resolve-Path ../smoke-win) "screen.png"))
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $crash) { Write-Output "::error title=Windows::падение при запуске: $(Get-Content $crash -Raw)"; exit 1 }
          if (-not $alive) { Write-Output "::error title=Windows::Ласточка закрылась в первые 40 секунд (код $($p.ExitCode))"; exit 1 }
          Write-Output "::notice title=Windows::запуск в порядке, 40 секунд без падений"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 7
          name: windows-start
          path: smoke-win/
      - name: Установщик и архив
        run: |
          R=build/windows/x64/runner/Release
          # библиотеки Visual C++ — чтобы запускалось и на «чистой» Windows / RDP-сервере
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do cp "/c/Windows/System32/$f" "$R/" || true; done
          ls "$R"
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup -y --no-progress
          mkdir -p ../dist
          APP_VERSION="$V" "$ISCC" tool/lastochka.iss
          (cd "$R" && 7z a -tzip "../../../../../../dist/Lastochka-$V-Windows-portable.zip" . > /dev/null)
          ls -la ../dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: windows
          path: dist/*

  # сохранить версии библиотек, если сборка Android прошла и они новые
  lock:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pubspec-lock
          path: lockdl
      - name: Сохранить pubspec.lock
        env:
          REF: ${{ github.ref_name }}
        run: |
          # только библиотеки с официального pub.dev
          if grep -E '^\s+url:' lockdl/pubspec.lock | grep -v '"https://pub.dev"'; then echo "::error::в pubspec.lock чужой источник"; exit 1; fi
          cp lockdl/pubspec.lock mobile/pubspec.lock
          if [ -n "$(git status --porcelain -- mobile/pubspec.lock)" ]; then
            git config user.name "alexbel692-art"
            git config user.email "alexbel692-art@users.noreply.github.com"
            git add mobile/pubspec.lock
            git commit -m "Зафиксированы версии библиотек (pubspec.lock)"
            git push origin "HEAD:refs/heads/$REF" || echo "::warning::Не удалось сохранить pubspec.lock"
          fi

  # Проверка на эмуляторе Android 7 (как Samsung A5): ставится, запускается, не падает, показывает вход
  emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: dist
      - name: Доступ к KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 7 — установка и запуск
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash src/mobile/tool/emulator_smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 7
          name: android7-check
          path: smoke/

  # Автотест интерфейса: настоящий сервер Matrix (Synapse в Docker) + эмулятор Android 7.
  # Вход, секретная фраза, группа, отправка (проверяется и на сервере), крупные эмодзи, напоминание,
  # панель стикеров/GIF, цвет оформления. Не прошёл — выпуск не публикуется.
  e2e:
    uses: ./.github/workflows/e2e.yml

  release:
    # все платформы обязательны: неполный выпуск не публикуется
    if: ${{ inputs.publish && !cancelled() && !failure() }}
    needs: [android, android-sign, ios, macos, windows, emulator, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      # каждая сборка — в свою папку; к подписи берутся только ожидаемые файлы от «своей» сборки:
      # чужая сборка не сможет подложить или подменить файл другой платформы
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: art
      - name: Отбор файлов для выпуска
        env:
          V: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Неверный номер версии: $V"; exit 1; }
          # такой выпуск уже есть или версия не новее последней — не публикуем
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$V" >/dev/null 2>&1; then echo "::error::Выпуск v$V уже существует"; exit 1; fi
          cur=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '.[]|select(.draft|not)|.tag_name|ltrimstr("v")' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -n "$cur" ] && [ "$(printf '%s\n%s\n' "$cur" "$V" | sort -V | tail -1)" != "$V" ]; then echo "::error::$V не новее $cur"; exit 1; fi
          mkdir -p dist
          take() {
            src="art/$1"; shift
            for n in "$@"; do
              # каждый файл обязателен, обычный файл (не ссылка), разумного размера
              [ -f "$src/$n" ] && [ ! -L "$src/$n" ] || { echo "::error::$1: нет файла $n"; exit 1; }
              sz=$(stat -c%s "$src/$n")
              [ "$sz" -gt 1000000 ] && [ "$sz" -lt 2000000000 ] || { echo "::error::$n: странный размер $sz"; exit 1; }
              [ -e "dist/$n" ] && { echo "::error::Файл $n пришёл дважды"; exit 1; }
              cp "$src/$n" dist/
            done
          }
          take android-signed "Lastochka-$V-Android-arm64.apk" "Lastochka-$V-Android-arm.apk" "Lastochka-$V-Android.apk"
          take ios "Lastochka-$V-iPhone-unsigned.ipa"
          take macos "Lastochka-$V-arm64.dmg" "Lastochka-$V-x64.dmg"
          take windows "Lastochka-Setup-$V.exe" "Lastochka-$V-Windows-portable.zip"
          [ "$(ls dist | wc -l)" -eq 8 ] || { echo "::error::ожидалось 8 файлов"; ls -la dist; exit 1; }
          ls -la dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - name: Подпись файлов
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          V: ${{ inputs.version }}
        run: |
          node src/scripts/sign-files.cjs dist "$V"
          cd dist && sha256sum $(ls | grep -v '\.sig$') > SHA256SUMS.txt && ls -la
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          name: Ласточка ${{ inputs.version }}${{ inputs.beta && ' (тестовая)' || '' }}
          prerelease: ${{ inputs.beta }}
          make_latest: ${{ !inputs.beta }}
          target_commitish: ${{ github.sha }}
          body: |
            Ласточка — защищённый мессенджер на Matrix. Одна программа для всех устройств; обновляется сама, каждое обновление подписано и проверяется перед установкой.
            • Windows: Lastochka-Setup-….exe — установка для всех пользователей (подходит для RDP), живёт в трее, запускается с Windows. Прежняя версия 3.x удаляется автоматически.
            • macOS (Apple Silicon и Intel): Lastochka-…-arm64.dmg (или -x64.dmg — это тот же файл)
            • Android (телефоны и планшеты): Lastochka-…-Android.apk
            • iPhone: Lastochka-…-iPhone-unsigned.ipa — НЕ готовый установочный пакет: он не подписан Apple и на iPhone сам не установится. Это заготовка для самостоятельной подписи своим Apple ID (Sideloadly, AltStore) или сертификатом разработчика; подписанная версия для обычной установки появится после подключения учётной записи Apple Developer.
            • Подлинность любого файла: рядом лежит .sig (подпись Ласточки) и SHA256SUMS.txt.
          files: dist/*
