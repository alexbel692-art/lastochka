# Автотест интерфейса отдельно (вручную) и как часть выпуска (mobile.yml → e2e).
name: Автотест интерфейса

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - name: Приложение для автотеста
        working-directory: src/mobile
        run: |
          tool/annotate.sh "create" flutter create --no-pub --platforms android --org app.lastochka --project-name lastochka .
          rm -f test/widget_test.dart
          python tool/ci_prepare.py
          tool/annotate.sh "pub get" flutter pub get
          # зависимость автотеста — только здесь, в основной список библиотек не попадает
          tool/annotate.sh "pub add integration_test" flutter pub add 'dev:integration_test:{"sdk":"flutter"}'
          mkdir -p integration_test && cp e2e/app_test.dart integration_test/app_test.dart
      - name: Сервер Matrix (Synapse)
        working-directory: src/mobile
        run: bash tool/e2e_server.sh
      - name: Доступ к KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Автотест на Android 7
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          target: default
          arch: x86_64
          profile: Nexus 5X
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash src/mobile/tool/e2e_android.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 7
          name: e2e-android
          path: e2e-out/

