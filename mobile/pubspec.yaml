name: lastochka
description: Ласточка — защищённый мессенджер на Matrix (Android, iOS).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  matrix: ^11.0.0
  flutter_vodozemac: ^0.8.1
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.0
  http: ^1.4.0
  intl: any
  collection: ^1.18.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
