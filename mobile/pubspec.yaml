name: lastochka
description: Ласточка — защищённый мессенджер на Matrix (Android, iOS).
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  matrix: ^11.0.0
  flutter_vodozemac: ^0.8.1
  sqflite_common_ffi: ^2.4.3
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.0
  http: ^1.4.0
  intl: any
  collection: ^1.18.0
  image_picker: ^1.1.2
  flutter_webrtc: ^1.0.0
  webrtc_interface: ^1.2.0
  audioplayers: ^6.1.0
  record: ^6.0.0
  file_picker: ^13.1.0
  open_filex: ^4.7.0
  flutter_local_notifications: ^22.3.1
  window_manager: ^0.5.1
  tray_manager: ^0.5.1
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/stickers/
    - assets/tray.ico
    - assets/tray.png

# SQLCipher вместо обычного SQLite на всех платформах (база сообщений зашифрована)
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
